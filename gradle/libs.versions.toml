# https://docs.gradle.org/current/userguide/version_catalogs.html#sec::toml-dependencies-format

[versions]
springBoot = "4.1.0"
langchain4j = "1.18.1"

[libraries]
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }
langchain4j-open-ai = { module = "dev.langchain4j:langchain4j-open-ai", version.ref = "langchain4j" }
# Main module -- carries dev.langchain4j.memory.chat.* (MessageWindowChatMemory).
langchain4j = { module = "dev.langchain4j:langchain4j", version.ref = "langchain4j" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
# Server-rendered admin pages, and a password on the door in front of them.
spring-boot-starter-thymeleaf = { module = "org.springframework.boot:spring-boot-starter-thymeleaf" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
thymeleaf-extras-springsecurity = { module = "org.thymeleaf.extras:thymeleaf-extras-springsecurity6" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
postgresql = { module = "org.postgresql:postgresql" }

# Boot 4 is modularised: Flyway autoconfiguration lives in its own module, NOT in
# spring-boot-autoconfigure. Depending on bare flyway-core would put Flyway on the
# classpath and never run it. flyway-database-postgresql is required separately
# since Flyway 10.
spring-boot-flyway = { module = "org.springframework.boot:spring-boot-flyway" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }

spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
# @WithMockUser and the csrf() request post-processor, for testing the admin pages.
spring-security-test = { module = "org.springframework.security:spring-security-test" }
# Boot 4 splits the test slices out of spring-boot-test-autoconfigure: @WebMvcTest and
# MockMvc live here, not in spring-boot-starter-test.
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
# Testcontainers 2.x renamed its artifacts (testcontainers-postgresql, not postgresql).
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
