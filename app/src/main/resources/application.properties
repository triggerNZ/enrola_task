# Load .env (as a properties file) when present. A real environment variable
# still wins, so exporting OPENAI_API_KEY overrides the file.
spring.config.import=optional:file:.env[.properties]

# No embedded web server: this is a command-line application.
spring.main.web-application-type=none
spring.main.banner-mode=off

# Keep console output terse enough to read as CLI output.
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %-40.40logger{39} : %msg%n

# Empty default so a missing key produces a clear message, not a startup failure.
openai.api-key=${OPENAI_API_KEY:}
openai.model=gpt-5.1
openai.max-completion-tokens=2000
openai.timeout=60s
