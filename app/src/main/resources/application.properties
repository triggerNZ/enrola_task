# Load .env (as a properties file) when present. A real environment variable
# still wins, so exporting OPENAI_API_KEY overrides the file.
spring.config.import=optional:file:.env[.properties]

# The chat is served over HTTP; chat.sh is the client. Keep this in step with
# ENROLA_URL, which is how chat.sh finds the server.
server.port=${ENROLA_PORT:8080}

spring.main.banner-mode=off

# This console is a server log, not a chat prompt, so the usual INFO startup
# output is wanted. (It was WARN with a bare pattern while the conversation ran
# here and log lines would have interrupted it.)
logging.level.root=INFO

# Empty default so a missing key is caught by name at startup, rather than surfacing
# as a placeholder-resolution failure. The server refuses to start without it.
openai.api-key=${OPENAI_API_KEY:}

openai.model=gpt-5.5
openai.max-completion-tokens=2000
openai.timeout=60s

# Postgres from docker-compose.yml. Credentials come from .env, so the compose
# file and the app never drift apart. The defaults match the compose defaults.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:enrola}
spring.datasource.username=${POSTGRES_USER:enrola}
spring.datasource.password=${POSTGRES_PASSWORD:}

# Fail reasonably fast rather than hanging when Postgres is unreachable.
spring.datasource.hikari.connection-timeout=5000

# Flyway migrates during startup, so the app now REQUIRES a reachable database.
# (It previously started fine with Postgres down, because Hikari connects lazily.)
# This is the default -- stated explicitly so the requirement is discoverable.
spring.flyway.enabled=true

# Sliding window handed to the model on each request. The full transcript is always
# kept in Postgres; this only bounds how much of it each call carries. Must be >= 2,
# so a window can hold a question and its answer.
chat.max-messages=20

# Who the agent says it is. Kept here rather than in the brief so a rebrand is a config
# change, and so the name cannot drift between the brief and the outreach instruction --
# the agent introduced itself differently on every run before these existed.
agent.name=Anna
agent.company=Comparato

# The agent's instructions now live in the `prompt` table, versioned, seeded on first start
# from knowledge/*.md and edited at /admin/prompts. There is deliberately no property that
# overrides them: one that quietly beat the database would make the review pages lie about
# what a conversation actually ran on.

# The single account that can reach /admin. Blank refuses to start, the same way a missing
# OPENAI_API_KEY does: an admin UI that reads every customer conversation should not be
# reachable because someone forgot to set a variable.
admin.username=admin
admin.password=${ADMIN_PASSWORD:}

# The consultant's diary. One person, so a slot is either free or it is not.
#
# Everything is in one business timezone rather than the lead's: with a single consultant
# the hours are theirs, and times are quoted with the zone named so a lead in another
# state knows to convert. This is also the clock the agent is told "now" from.
booking.timezone=Australia/Sydney
booking.opens=08:00
# Exclusive, so with 15-minute slots the last one starts at 17:45.
booking.closes=18:00
booking.slot-minutes=15
# Weekdays only; a consultant's diary, not a call centre.

# Nothing bookable in the next half hour, nothing beyond a fortnight, so the agent cannot
# promise a call five minutes from now or three months out.
booking.minimum-notice=30m
booking.horizon=14d

# How many free slots to offer when the one they asked for will not do. Three fits an SMS.
booking.alternatives=3

# How many SMS a single reply may occupy. Over this, the agent is asked once to say it
# shorter, and only then trimmed at the last full sentence.
#
# Three, not two: at two the budget is ~306 characters, and answers about waiting periods
# or the surcharge genuinely need more, so the agent overran and got trimmed on most
# turns. A trimmed answer is worse than a slightly longer one.
sms.max-parts=3
