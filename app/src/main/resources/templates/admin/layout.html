<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="page(title, body)">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="'Enrola admin — ' + ${title}">Enrola admin</title>
    <!--
      Inline, because two pages do not justify a stylesheet, an asset pipeline, or a
      cache-busting story. If this grows past a handful of screens, move it out.
    -->
    <style>
      :root {
        --ink: #1a1a1a;
        --muted: #666;
        --line: #e0e0e0;
        --bg: #fafafa;
        --accent: #1a5490;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 2rem 1.5rem 4rem;
        font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: var(--ink);
        background: var(--bg);
      }
      main { max-width: 60rem; margin: 0 auto; }
      h1 { font-size: 1.4rem; margin: 0 0 0.25rem; }
      a { color: var(--accent); }
      .muted { color: var(--muted); font-size: 0.875rem; }
      nav { margin: 0 0 1.5rem; }

      table { width: 100%; border-collapse: collapse; background: #fff; }
      th, td { text-align: left; padding: 0.6rem 0.75rem; border-bottom: 1px solid var(--line); }
      th { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
      tbody tr:hover { background: #f5f8fb; }
      td.rating { white-space: nowrap; }

      .prompts-used { background: #fff; border: 1px solid var(--line); padding: 0.6rem 1rem; margin-bottom: 1rem; }
      .prompts-used .who { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
      .prompts-used dl { display: grid; grid-template-columns: max-content 1fr; gap: 0.1rem 0.8rem; margin: 0.4rem 0 0; }
      .prompts-used dd { margin: 0; font-size: 0.85rem; }
      .prompts-used .superseded { color: #a04000; }

      .transcript { background: #fff; border: 1px solid var(--line); padding: 0.5rem 1rem; }
      .msg { padding: 0.6rem 0; border-bottom: 1px solid var(--line); }
      .msg:last-child { border-bottom: 0; }
      .msg .who { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
      .msg.ai .who { color: var(--accent); }
      .msg .text { white-space: pre-wrap; margin-top: 0.15rem; }
      .msg.tool { color: var(--muted); }
      .msg.tool .text { font-size: 0.9rem; }

      code { font: 0.85rem/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; background: #f0f2f4; padding: 0.05rem 0.3rem; }
      .tool-call { margin-top: 0.2rem; }
      .tool-call dl { display: grid; grid-template-columns: max-content 1fr; gap: 0 0.6rem; margin: 0.3rem 0 0 1rem; }
      .tool-call dt { font-size: 0.8rem; color: var(--muted); }
      .tool-call dd { margin: 0; font-size: 0.85rem; word-break: break-word; }
      .tool-name { font-size: 0.75rem; margin-bottom: 0.2rem; }

      form.review { background: #fff; border: 1px solid var(--line); padding: 1rem; margin-top: 1.5rem; }
      fieldset { border: 0; padding: 0; margin: 0 0 0.75rem; }
      legend { font-weight: 600; padding: 0; margin-bottom: 0.35rem; }
      .stars label { margin-right: 0.9rem; }
      textarea { width: 100%; min-height: 6rem; font: inherit; padding: 0.5rem; border: 1px solid var(--line); }
      textarea.prompt-body { min-height: 28rem; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
      button { font: inherit; padding: 0.5rem 1.1rem; background: var(--accent); color: #fff; border: 0; cursor: pointer; }
      .saved { background: #e8f4ea; border: 1px solid #b8dcc0; padding: 0.5rem 0.75rem; margin-bottom: 1rem; }
    </style>
  </head>
  <body>
    <main>
      <nav class="muted"><a href="/admin/conversations">← All conversations</a></nav>
      <div th:replace="${body}">Page content goes here.</div>
    </main>
  </body>
</html>
